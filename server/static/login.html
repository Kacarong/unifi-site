<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>unifi</title>
<link rel="stylesheet" href="/style.css" />
<style>
  .gate { min-height: 100vh; display: grid; place-items: center; }
  .gate form { width: min(320px, 90vw); display: grid; gap: 12px; }
  .gate h1 { margin: 0; font-size: 20px; }
  .gate p { margin: 0; color: var(--muted, #8b93a7); font-size: 13px; }
  .gate input { padding: 10px 12px; border-radius: 8px; border: 1px solid #2a3145;
                background: #141926; color: inherit; font: inherit; }
  .gate button { padding: 10px 12px; border-radius: 8px; border: 0; cursor: pointer;
                 background: #e0364a; color: #fff; font: inherit; font-weight: 600; }
  .gate .err { color: #ff8a9a; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<div class="gate">
  <form id="f">
    <h1>⬡ unifi</h1>
    <p>비공개 사이트입니다. 비밀번호를 입력하세요.</p>
    <input id="pw" type="password" autocomplete="current-password" autofocus placeholder="비밀번호" />
    <button type="submit">들어가기</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const res = await fetch('/api/_login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: document.getElementById('pw').value }),
  });
  if (res.ok) { location.replace(location.pathname + location.search); return; }
  const body = await res.json().catch(() => ({}));
  err.textContent = res.status === 429
    ? `시도가 너무 많습니다. ${body.retry_after || 60}초 뒤 다시 시도하세요.`
    : '비밀번호가 맞지 않습니다.';
  document.getElementById('pw').select();
});
</script>
</body>
</html>
