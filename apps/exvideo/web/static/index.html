<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070b16" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<title>ex-video · 강의영상 정리 도우미</title>
<!-- 통합 셸의 공용 디자인 시스템 -->
<link rel="stylesheet" href="/ui.css" />
<style>
  /* 이 앱만 파랑/초록 강조색을 쓴다 */
  .wrap { --accent: #4f8dff; --accent-2: #22c9a0; max-width: 780px; }
  .spacer { flex: 1; }

  .hero { padding: 22px 2px 6px; }
  .hero p { margin-top: 8px; font-size: 13.5px; }

  .opts { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; align-items: center; }
  .opts label { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 14px; min-height: 44px; }
  .opts select { width: auto; min-width: 116px; }

  .full { width: 100%; margin-top: 16px; }
  .row-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .row-btns .btn { flex: 1 1 140px; }

  /* 진행 막대 — 안쪽에서 빛이 흐른다 */
  .bar {
    height: 10px;
    background: rgba(8, 12, 24, 0.7);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    overflow: hidden;
    margin: 16px 0 10px;
  }
  .bar > div {
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
    background-size: 220% 100%;
    animation: flow 1.6s linear infinite;
    transition: width 420ms var(--spring);
  }
  @keyframes flow { to { background-position: -220% 0; } }

  .log, pre.preview {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 12.5px;
    color: var(--sub);
    max-height: 240px;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    white-space: pre-wrap;
    background: rgba(8, 12, 24, 0.7);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 12px;
  }
  pre.preview { max-height: 300px; }

  .hidden { display: none; }
  .hint { color: var(--dim); font-size: 12.5px; margin-top: 12px; line-height: 1.7; }
  a { color: var(--accent); }
</style>
    <!-- JS 가 꺼져 있으면 등장 애니메이션 없이 바로 보여 준다 -->
    <noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>
</head>
<body>
<header class="topbar">
  <a class="back" href="/">← unifi</a>
  <span class="spacer"></span>
  <span class="tiny">ex-video</span>
</header>

<div class="wrap stack">
  <section class="hero reveal">
    <h1>🎬 ex-video</h1>
    <p class="muted">강의 영상 → 전사 + 슬라이드 텍스트 + 슬라이드/그림 이미지 → 붙여넣기용 프롬프트(bundle.md)</p>
  </section>

  <section class="panel reveal" id="form">
    <label>영상 주소 (구글드라이브 공유 링크 / URL / 서버 로컬 경로)
      <input id="source" type="text" placeholder="https://drive.google.com/file/d/FILEID/view" />
    </label>
    <div class="opts">
      <label><input type="checkbox" id="transcribe" checked /> 음성 전사</label>
      <label><input type="checkbox" id="ocr" checked /> 슬라이드 OCR</label>
      <label><input type="checkbox" id="figures" checked /> 그림 크롭</label>
      <label>모델
        <select id="model">
          <option>large-v3</option><option>medium</option><option selected>small</option><option>base</option>
        </select>
      </label>
    </div>
    <div class="hint">구글드라이브는 "링크가 있는 모든 사용자" 권한이어야 합니다. 첫 실행은 모델 다운로드로 시간이 걸릴 수 있어요.</div>
    <button id="startBtn" class="btn primary full">추출 시작</button>
  </section>

  <section class="panel reveal hidden" id="progressCard">
    <div id="statusText">준비 중…</div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="log" id="log"></div>
    <div class="row-btns hidden" id="doneBtns">
      <button class="btn primary" id="dlZip">결과 zip 내려받기</button>
      <button class="btn" id="dlBundle">bundle.md 보기</button>
      <button class="btn" id="againBtn">새로 하기</button>
    </div>
  </section>

  <section class="panel reveal hidden" id="previewCard">
    <label>bundle.md 미리보기 (전체 복사해서 Gemini/Claude에 붙여넣으세요)</label>
    <pre class="preview" id="preview"></pre>
  </section>
</div>

<script src="/ui.js"></script>
<script src="./app.js"></script>
</body>
</html>
