<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ex-video · 강의영상 정리 도우미</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#9aa7b4; --accent:#3b82f6; --ok:#22c55e; --err:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:8px 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
  label { display:block; font-size:14px; margin:10px 0 6px; color:var(--muted); }
  input[type=text] { width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:#0d1117; color:var(--text); font-size:15px; }
  .opts { display:flex; flex-wrap:wrap; gap:14px; margin-top:12px; align-items:center; }
  .opts label { display:flex; align-items:center; gap:6px; margin:0; color:var(--text); font-size:14px; }
  select { background:#0d1117; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 8px; }
  button { width:100%; margin-top:16px; padding:13px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .bar { height:10px; background:#0d1117; border:1px solid var(--border); border-radius:6px; overflow:hidden; margin:14px 0 8px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  .log { font-family:ui-monospace,monospace; font-size:12.5px; color:var(--muted); max-height:220px; overflow:auto; white-space:pre-wrap; background:#0d1117; border:1px solid var(--border); border-radius:8px; padding:10px; }
  .row-btns { display:flex; gap:10px; }
  .row-btns button { background:#21262d; border:1px solid var(--border); }
  .row-btns button.primary { background:var(--ok); border:none; }
  .hidden { display:none; }
  .hint { color:var(--muted); font-size:12.5px; margin-top:10px; }
  pre.preview { max-height:280px; overflow:auto; background:#0d1117; border:1px solid var(--border); border-radius:8px; padding:10px; font-size:12.5px; white-space:pre-wrap; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <a href="/" style="color:var(--muted);font-size:13px;text-decoration:none;">← unifi</a>
  <h1>🎬 ex-video</h1>
  <div class="sub">강의 영상 → 전사 + 슬라이드 텍스트 + 슬라이드/그림 이미지 → 붙여넣기용 프롬프트(bundle.md)</div>

  <div class="card" id="form">
    <label>영상 주소 (구글드라이브 공유 링크 / URL / 서버 로컬 경로)</label>
    <input id="source" type="text" placeholder="https://drive.google.com/file/d/FILEID/view" />
    <div class="opts">
      <label><input type="checkbox" id="transcribe" checked /> 음성 전사</label>
      <label><input type="checkbox" id="ocr" checked /> 슬라이드 OCR</label>
      <label><input type="checkbox" id="figures" checked /> 그림 크롭</label>
      <label>모델
        <select id="model">
          <option>large-v3</option><option>medium</option><option selected>small</option><option>base</option>
        </select>
      </label>
    </div>
    <div class="hint">구글드라이브는 "링크가 있는 모든 사용자" 권한이어야 합니다. 첫 실행은 모델 다운로드로 시간이 걸릴 수 있어요.</div>
    <button id="startBtn">추출 시작</button>
  </div>

  <div class="card hidden" id="progressCard">
    <div id="statusText">준비 중…</div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="log" id="log"></div>
    <div class="row-btns hidden" id="doneBtns" style="margin-top:14px;">
      <button class="primary" id="dlZip">결과 zip 내려받기</button>
      <button id="dlBundle">bundle.md 보기</button>
      <button id="againBtn">새로 하기</button>
    </div>
  </div>

  <div class="card hidden" id="previewCard">
    <label>bundle.md 미리보기 (전체 복사해서 Gemini/Claude에 붙여넣으세요)</label>
    <pre class="preview" id="preview"></pre>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
