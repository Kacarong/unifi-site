<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16"><meta name="color-scheme" content="dark">
<title>{% block title %}공고 알림{% endblock %} · 임대·분양 공고 알림</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="{{ base }}/static/style.css">
<link rel="stylesheet" href="/appshell.css">
<script src="/appshell.js"></script>
</head>
<body>
<header class="top">
  <div class="brand-wrap"><a class="back" href="/">← unifi</a><a class="brand" href="{{ base }}/">🏠 공고 알림</a></div>
  <nav>
    <a href="{{ base }}/">대시보드</a>
    <a href="{{ base }}/notices">공고</a>
    <a href="{{ base }}/filters">필터</a>
    <a href="{{ base }}/settings">설정</a>
  </nav>
</header>
<main>
  {% if msg %}<div class="flash ok">{{ msg }}</div>{% endif %}
  {% if err %}<div class="flash err">{{ err }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<script>window.HA_BASE = "{{ base }}"; window.HA_CSRF = "{{ csrf }}";</script>
<script src="{{ base }}/static/app.js"></script>
</body>
</html>
