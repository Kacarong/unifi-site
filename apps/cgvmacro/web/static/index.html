<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b16" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>CGV 좌석 감시 · unifi</title>
    <!-- 통합 셸의 공용 디자인 시스템. 앱은 이 한 줄만 물려받는다 -->
    <link rel="stylesheet" href="/ui.css" />
    <link rel="stylesheet" href="./style.css" />
      <!-- JS 가 꺼져 있으면 등장 애니메이션 없이 바로 보여 준다 -->
    <noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>
</head>
  <body>
    <header class="topbar">
      <a class="back" href="/">← unifi</a>
      <span class="spacer"></span>
      <span class="tiny">CGV 좌석 감시</span>
    </header>

    <div class="wrap stack">
      <!-- 포털 카드와 같은 이름표: 카드를 누르면 이 자리로 이어지듯 넘어간다 -->
      <section class="hero reveal" style="view-transition-name: app-cgvmacro">
        <h1>🎟️ CGV 좌석 감시</h1>
        <p class="muted">
          감시·알림은 서버가 계속 돌립니다. 좌석 선점이 필요한 순간에만 로컬 PC의
          크롬이 열려 자리를 잡습니다.
        </p>
      </section>

      <section class="panel reveal">
        <div class="row">
          <h2>감시 상태</h2>
          <div class="btns">
            <button id="startBtn" class="btn primary">감시 시작</button>
            <button id="stopBtn" class="btn">중지</button>
          </div>
        </div>
        <div id="status" class="status">불러오는 중…</div>
      </section>

      <section class="panel reveal">
        <h2>감시 대상 추가</h2>
        <div class="form field-grid">
          <label>별칭<input id="f_name" type="text" placeholder="오디세이 센텀시티" /></label>
          <label>영화<input id="f_movie" type="text" placeholder="영화명 일부" /></label>
          <label>극장<input id="f_theater" type="text" placeholder="센텀시티" /></label>
          <label>날짜<input id="f_date" type="date" /></label>
          <label>시작 시각<input id="f_from" type="time" /></label>
          <label>끝 시각<input id="f_to" type="time" /></label>
          <label>상영 포맷<input id="f_screen" type="text" placeholder="IMAX / 4DX (비우면 전체)" /></label>
          <label>최소 잔여석<input id="f_min" type="number" min="1" value="1" /></label>
          <label class="check"><input id="f_auto" type="checkbox" /> 감지되면 로컬 PC로 자동 선점</label>
          <label>인원 (일반/청소년/우대)
            <span class="triple">
              <input id="f_gen" type="number" min="0" value="2" />
              <input id="f_teen" type="number" min="0" value="0" />
              <input id="f_senior" type="number" min="0" value="0" />
            </span>
          </label>
          <label>원하는 좌석<input id="f_seats" type="text" placeholder="E9,E10 (비우면 자동)" /></label>
        </div>
        <div class="btns">
          <button id="previewBtn" class="btn">회차 미리보기</button>
          <button id="addBtn" class="btn primary">대상 추가</button>
        </div>
        <div id="preview" class="preview hidden"></div>
      </section>

      <section class="panel reveal">
        <h2>감시 대상</h2>
        <div id="targets" class="list">아직 없습니다.</div>
      </section>

      <section class="panel reveal">
        <h2>최근 감지</h2>
        <div id="events" class="list">아직 없습니다.</div>
      </section>

      <section class="panel reveal">
        <h2>선점 작업 (로컬 PC)</h2>
        <div id="jobs" class="list">아직 없습니다.</div>
        <p class="hint">
          로컬 PC에서 <code>python agent/agent.py --server &lt;이 사이트 주소&gt;</code> 를
          실행해 두면 여기 쌓인 작업을 가져가 크롬으로 좌석을 잡습니다.
        </p>
      </section>

      <section class="panel reveal">
        <h2>알림 설정</h2>
        <div class="form field-grid">
          <label>디스코드 Webhook URL<input id="s_webhook" type="text" placeholder="https://discord.com/api/webhooks/…" /></label>
          <label>멘션<input id="s_mention" type="text" placeholder="<@사용자ID> 또는 @everyone" /></label>
          <label>폴링 주기(초)<input id="s_interval" type="number" min="10" value="45" /></label>
          <label>지터(초)<input id="s_jitter" type="number" min="0" value="15" /></label>
          <label>에이전트 토큰<input id="s_token" type="text" placeholder="공개 사이트에서는 필수" /></label>
        </div>
        <div class="btns"><button id="saveSettings" class="btn primary">설정 저장</button></div>
      </section>
    </div>

    <script src="/ui.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
